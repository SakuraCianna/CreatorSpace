name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - codex/CreatorSpace
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: creatorspace
          POSTGRES_USER: creatorspace
          POSTGRES_PASSWORD: creatorspace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U creatorspace -d creatorspace"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_DB: creatorspace
      POSTGRES_USERNAME: creatorspace
      POSTGRES_PASSWORD: creatorspace
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      ADMIN_PASSWORD_HASH: '$2a$10$7EqJtq98hPqEX7fNZaFWoOhi4jGJGv7D8Y6nQvJ8b0lH0oM2oV8eK'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Check Docker availability
        run: docker version

      - name: Run Maven tests
        run: mvn -B -f backend/pom.xml test

      - name: Upload backend test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports
          if-no-files-found: ignore
          retention-days: 7

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend --registry=https://registry.npmjs.org/

      - name: Audit frontend dependencies
        run: npm audit --prefix frontend --registry=https://registry.npmjs.org/ --audit-level=high

      - name: Build frontend
        run: npm run build --prefix frontend

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 7
